<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">Benefício social</title><desc id="description">Benefício social e suas principais relações.</desc><style>
  :host{display:block;color:#f0a121}
