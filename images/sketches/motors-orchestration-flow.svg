<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title description"><title id="title">Orquestração dos motores</title><desc id="description">O Motor de Borderô aciona a triagem de cada entidade e consolida o resultado.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:2/1;background:transparent;overflow:hidden}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-arrow{fill:none;stroke:#f0a121;stroke-width:1.15;stroke-opacity:.7;marker-end:url(#sk-arrow);vector-effect:non-scaling-stroke}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:rgba(240,161,33,.018);stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .sk-section-label{fill:#f0a121;fill-opacity:.76;font:600 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.04em}
  .sk-node-label{fill:#f0a121;fill-opacity:.74;font:500 11px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.04em}
  .sk-flow-label{fill:#f0a121;fill-opacity:.9;font:500 17px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.01em}
  .sk-flow-caption{fill:#f0a121;fill-opacity:.62;font:500 13px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.07em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:rgba(240,161,33,.018);stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g transform="translate(-15.2 -25) scale(1.04 1)"><defs>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="sk-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#f0a121" fill-opacity=".72" /></marker>
  </defs><g class="sk-flow-step" transform="translate(58 54)"><rect class="sk-plane" x="0" y="0" width="200" height="96" rx="11" /><g class="sk-icon" transform="translate(83 14) scale(1.4166666666666667)"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" /><path d="m21.854 2.147-10.94 10.939" /></g><text class="sk-flow-label" x="100" y="78">Seu sistema</text></g><g class="sk-flow-step" transform="translate(502 54)"><rect class="sk-plane" x="0" y="0" width="200" height="96" rx="11" /><g class="sk-icon" transform="translate(83 14) scale(1.4166666666666667)"><path d="M13 16H8M14 8H8M16 12H8M4 3a1 1 0 0 1 1-1 1.3 1.3 0 0 1 .7.2l.933.6a1.3 1.3 0 0 0 1.4 0l.934-.6a1.3 1.3 0 0 1 1.4 0l.933.6a1.3 1.3 0 0 0 1.4 0l.933-.6a1.3 1.3 0 0 1 1.4 0l.934.6a1.3 1.3 0 0 0 1.4 0l.933-.6A1.3 1.3 0 0 1 19 2a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1 1.3 1.3 0 0 1-.7-.2l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.934.6a1.3 1.3 0 0 1-1.4 0l-.933-.6a1.3 1.3 0 0 0-1.4 0l-.933.6a1.3 1.3 0 0 1-1.4 0l-.934-.6a1.3 1.3 0 0 0-1.4 0l-.933.6A1.3 1.3 0 0 1 4 21z" /></g><text class="sk-flow-label" x="100" y="78">Motor Borderô</text></g><g class="sk-flow-step" transform="translate(502 250)"><rect class="sk-plane" x="0" y="0" width="200" height="96" rx="11" /><g class="sk-icon" transform="translate(83 14) scale(1.4166666666666667)"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 3.128a4 4 0 0 1 0 7.744M22 21v-2a4 4 0 0 0-3-3.87" /><circle cx="9" cy="7" r="4" /></g><text class="sk-flow-label" x="100" y="78">Motor CPF/CNPJ</text></g><g class="sk-flow-step" transform="translate(58 250)"><rect class="sk-plane" x="0" y="0" width="200" height="96" rx="11" /><g class="sk-icon" transform="translate(83 14) scale(1.4166666666666667)"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></g><text class="sk-flow-label" x="100" y="78">Resultado único</text></g><path class="sk-arrow" d="M258 102H492" /><path class="sk-arrow" d="M602 150V240" /><path class="sk-arrow" d="M502 298H268" /><text class="sk-flow-caption" x="380" y="214">CADA ENTIDADE ÚNICA PASSA PELA TRIAGEM</text><circle class="sk-hot" r="3"><animateMotion dur="5.4s" begin="0s" repeatCount="indefinite" path="M258 102H492" /></circle></g></svg>