t="18" x="3" y="3" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></g><path class="sk-line" d="M62 28h170M62 46h144" /></g><circle class="sk-hot" r="3"><animateMotion dur="4.8s" begin="0s" repeatCount="indefinite" path="M326 215C250 215 250 112 180 112" /></circle><circle class="sk-hot" r="3"><animateMotion dur="4.8s" begin="2.4s" repeatCount="indefinite" path="M434 215C510 215 510 318 580 318" /></circle></svg>