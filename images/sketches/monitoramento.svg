      <g class="sk-icon" transform="translate(18 17) scale(0.8333333333333334)"><path d="M10 12h4M10 8h4M14 21v-3a2 2 0 0 0-4 0v3" /><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" /><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" /></g>
      <path class="sk-line" d="M62 20h194M62 35h116" />

    </g>
    <g class="sk-row" transform="translate(60 238)">
      <rect class="sk-row-bg" width="406" height="54" rx="8" />
      <rect class="sk-icon-box" x="10" y="9" width="36" height="36" rx="8" />
      <g class="sk-icon" transform="translate(18 17) scale(0.8333333333333334)"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></g>
      <path class="sk-line" d="M62 20h160M62 35h95" />

    </g>
    <g class="sk-row" transform="translate(60 296)">
      <rect class="sk-row-bg" width="406" height="54" rx="8" />
      <rect class="sk-icon-box" x="10" y="9" width="36" height="36" rx="8" />
      <g class="sk-icon" transform="translate(18 17) scale(0.8333333333333334)"><path d="M10 12h4M10 8h4M14 21v-3a2 2 0 0 0-4 0v3" /><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" /><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" /></g>
      <path class="sk-line" d="M62 20h146M62 35h121" />

    </g>
  </g>
    <g class="sk-timeline" transform="translate(510 52)">
    <rect class="sk-plane" x="0" y="0" width="202" height="314" rx="13" />
    <path class="sk-hair" d="M34 47V267" />
    <g class="sk-timeline-event" transform="translate(0 47)">
      <circle class="sk-timeline-dot" cx="34" r="6" />
      <path class="sk-line" d="M58-7h72M58 9h46" />

    </g><g class="sk-timeline-event" transform="translate(0 120.33333333333333)">
      <circle class="sk-timeline-dot" cx="34" r="6" />
      <path class="sk-line" d="M58-7h90M58 9h58" />

    </g><g class="sk-timeline-event is-active" transform="translate(0 193.66666666666666)">
