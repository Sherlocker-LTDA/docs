th d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8" /></g><text class="sk-flow-label" x="70" y="78">Registros</text></g><path class="sk-arrow" d="M180 190H210" /><path class="sk-arrow" d="M360 190C386 190 378 96 390 96" /><path class="sk-arrow" d="M360 190C386 190 378 284 390 284" /><path class="sk-arrow" d="M360 190H570" /><circle class="sk-hot" r="3"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M360 190C386 190 378 96 390 96" /></circle></g></svg>