      <g class="sk-mask mail-mask"><g class="sk-icon" transform="translate(23 38) scale(1.4166666666666667)"><path d="m22 7-8.991 5.727a2 2 0 0 1-2.009 0L2 7" /><rect x="2" y="4" width="20" height="16" rx="2" /></g><text class="sk-mask-text" x="78" y="65">m***@e****.com</text><path class="sk-hair" d="M23 101h296" /><text class="sk-mask-small" x="23" y="127">ID  ****-****-**42</text></g>
    </g>
    <style>
      .sk-social{opacity:.42;animation:network-found 8s ease-in-out infinite}.sk-social:nth-child(2){animation-delay:.5s}.sk-social:nth-child(3){animation-delay:1s}.sk-social:nth-child(4){animation-delay:1.5s}.sk-social:nth-child(5){animation-delay:2s}.sk-social:nth-child(6){animation-delay:2.5s}.sk-social:nth-child(7){animation-delay:3s}.sk-social:nth-child(8){animation-delay:3.5s}
      .sk-mask-text,.sk-mask-small{fill:#f0a121;font-family:'DM Mono',ui-monospace,monospace}.sk-mask-text{font-size:20px;letter-spacing:.08em}.sk-mask-small{font-size:13px;fill-opacity:.52;letter-spacing:.1em}.sk-mask{animation:mask-switch 8s ease-in-out infinite}.mail-mask{opacity:0;animation-delay:-4s}
      @keyframes network-found{0%,12%,100%{opacity:.42}20%,70%{opacity:1}}
      @keyframes mask-switch{0%,42%{opacity:1}50%,92%{opacity:0}100%{opacity:1}}
    </style></g></svg>