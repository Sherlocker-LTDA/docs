<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">Perfil comportamental</title><desc id="description">Uma pessoa se conecta a presença digital, padrões e deslocamentos.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#060605;overflow:hidden}
  .sk-grid{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.07}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:#080806;stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:#080806;stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
    <pattern id="behavior-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" class="sk-grid" /></pattern>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><rect width="760" height="430" fill="url(#behavior-grid)" /><g class="sk-entity-node is-active" transform="translate(170 215)">
    <circle class="sk-node-ring" r="32" />
    <g class="sk-icon" transform="translate(-13 -13) scale(1.0833333333333333)"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></g>
  </g><path class="sk-ghost" d="M202 215C318 215 316 82 454 82M202 215C332 215 334 215 602 215M202 215C318 215 316 348 454 348" /><g class="sk-stage " transform="translate(454 43)"><rect class="sk-plane" x="0" y="0" width="236" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3M12 12V8" /></g><path class="sk-line" d="M62 28h154M62 46h128" /></g><g class="sk-stage " transform="translate(454 176)"><rect class="sk-plane" x="0" y="0" width="236" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><path d="M5 21v-6M12 21V9M19 21V3" /></g><path class="sk-line" d="M62 28h154M62 46h128" /></g><g class="sk-stage " transform="translate(454 309)"><rect class="sk-plane" x="0" y="0" width="236" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><circle cx="6" cy="19" r="3" /><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15" /><circle cx="18" cy="5" r="3" /></g><path class="sk-line" d="M62 28h154M62 46h128" /></g><circle class="sk-hot" r="3"><animateMotion dur="4.8s" begin="0s" repeatCount="indefinite" path="M202 215C332 215 334 215 602 215" /></circle></svg>