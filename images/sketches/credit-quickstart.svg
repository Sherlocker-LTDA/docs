<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title description"><title id="title">Primeira análise de borderô</title><desc id="description">Um arquivo CNAB 400 percorre o processamento e devolve o resultado de cada título.</desc><style>
  :host{display:block;color:#f0a121}
