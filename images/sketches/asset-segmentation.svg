      <path class="sk-line" d="M62 20h112M62 35h72" />

    </g>
    <g class="sk-row" transform="translate(52 212)">
      <rect class="sk-row-bg" width="214" height="54" rx="8" />
      <rect class="sk-icon-box" x="10" y="9" width="36" height="36" rx="8" />
      <g class="sk-icon" transform="translate(18 17) scale(0.8333333333333334)"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></g>
      <path class="sk-line" d="M62 20h88M62 35h58" />

    </g>
  </g><path class="sk-arrow" d="M278 215h48" /><path class="sk-arrow" d="M454 215h52" /><g class="sk-scanner" transform="translate(326 112)"><rect class="sk-plane" x="0" y="0" width="128" height="206" rx="13" /><path class="sk-line" d="M17 44V17h27M111 44V17h-27M17 162v27h27M111 162v27h-27" /><path class="sk-hair" d="M64 17v172M17 103h94" /><rect class="catalog-scan" x="18" y="46" width="92" height="14" /></g><g transform="translate(506 92)"><rect class="sk-plane" x="0" y="0" width="214" height="246" rx="13" /><g transform="translate(18 28)"><rect class="sk-row-bg" width="178" height="82" rx="9" /><g class="sk-icon" transform="translate(14 25) scale(1.1666666666666667)"><path d="M5 21v-6M12 21V9M19 21V3" /></g><text class="sk-label segment-grade" x="58" y="35">FAIXA A</text><text class="sk-small-label segment-detail" x="58" y="58">MAIOR PRIORIDADE</text><g class="sk-icon" transform="translate(146 25) scale(1.0833333333333333)"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></g></g><g transform="translate(18 132)"><rect class="sk-row-bg" width="178" height="82" rx="9" /><g class="sk-icon" transform="translate(14 25) scale(1.1666666666666667)"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></g><text class="sk-label segment-grade" x="58" y="35">FAIXA B</text><text class="sk-small-label segment-detail" x="58" y="58">REVISAR</text><g class="sk-icon" transform="translate(146 25) scale(1.0833333333333333)"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></g></g></g><circle class="sk-hot" r="3"><animateMotion dur="5s" begin="0s" repeatCount="indefinite" path="M278 215h48" /></circle><style>.catalog-scan{fill:#f0a121;opacity:.05;animation:catalog-scan 5.8s ease-in-out infinite}.catalog-focus{animation:catalog-focus 5.8s ease-in-out infinite}.catalog-arrive{opacity:.25;animation:catalog-arrive 5.8s ease-in-out infinite}@keyframes catalog-scan{0%,24%,76%,100%{transform:translateY(0);opacity:.04}42%{opacity:.28}66%{transform:translateY(126px);opacity:.14}}@keyframes catalog-focus{0%,25%,100%{opacity:.28}42%,78%{opacity:1}}@keyframes catalog-arrive{0%,60%,100%{opacity:.25}76%,90%{opacity:1}}</style></g></g></svg>