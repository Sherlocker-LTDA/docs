<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">Base processual e tempo real</title><desc id="description">Duas fontes processuais convergem para um mesmo resultado jurídico.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:16/9;background:transparent;overflow:hidden}
  .sk-grid{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.07}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:rgba(240,161,33,.018);stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:rgba(240,161,33,.018);stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
    <pattern id="source-process" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" class="sk-grid" /></pattern>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><rect width="760" height="430" fill="url(#source-process)" /><g class="sk-stage " transform="translate(48 76)"><rect class="sk-plane" x="0" y="0" width="256" height="112" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5M3 12A9 3 0 0 0 21 12" /></g><path class="sk-line" d="M62 28h174M62 46h148" /></g><g class="sk-stage " transform="translate(48 244)"><rect class="sk-plane" x="0" y="0" width="256" height="112" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5" /></g><path class="sk-line" d="M62 28h174M62 46h148" /></g><path class="sk-flow" d="M304 132C390 132 392 183 484 183M304 300C390 300 392 247 484 247" /><circle class="sk-hot" r="3"><animateMotion dur="4.6s" begin="0s" repeatCount="indefinite" path="M304 300C390 300 392 247 484 247" /></circle><g class="sk-result" transform="translate(484 159)"><rect class="sk-plane" x="0" y="0" width="132" height="112" rx="12" /><g class="sk-icon" transform="translate(42 18) scale(2)"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" /><path d="m16 16 6-6" /><path d="m21.5 10.5-8-8" /><path d="m8 8 6-6" /><path d="m8.5 7.5 8 8" /></g><path class="sk-line" d="M24 84h84" /></g><g class="catalog-arrive"><g class="sk-icon" transform="translate(640 189) scale(1.75)"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></g></g><style>.catalog-scan{fill:#f0a121;opacity:.05;animation:catalog-scan 5.8s ease-in-out infinite}.catalog-focus{animation:catalog-focus 5.8s ease-in-out infinite}.catalog-arrive{opacity:.25;animation:catalog-arrive 5.8s ease-in-out infinite}@keyframes catalog-scan{0%,24%,76%,100%{transform:translateY(0);opacity:.04}42%{opacity:.28}66%{transform:translateY(126px);opacity:.14}}@keyframes catalog-focus{0%,25%,100%{opacity:.28}42%,78%{opacity:1}}@keyframes catalog-arrive{0%,60%,100%{opacity:.25}76%,90%{opacity:1}}</style></svg>