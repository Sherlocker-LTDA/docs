<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">familia sucessoes</title><desc id="description">Um processo é classificado e a categoria correspondente é destacada.</desc><style>
  :host{display:block;color:#f0a121}
