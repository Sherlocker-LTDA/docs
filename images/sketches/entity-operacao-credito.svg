<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">Operação de crédito</title><desc id="description">Operação de crédito e suas principais relações.</desc><style>
