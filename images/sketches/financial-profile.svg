  </g><g class="sk-entity-node is-active" transform="translate(226 256)">
    <circle class="sk-node-ring" r="32" />
    <g class="sk-icon" transform="translate(-13 -13) scale(1.0833333333333333)"><path d="M10 12h4M10 8h4M14 21v-3a2 2 0 0 0-4 0v3" /><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2" /><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16" /></g>
  </g><path class="sk-ghost" d="M166 176l60 80M258 256C352 256 354 82 492 82M258 256C360 256 364 215 602 215M258 256C352 256 354 348 492 348" /><g transform="translate(492 82)"><circle class="sk-node-ring" r="29" /><g class="sk-icon" transform="translate(-12 -12) scale(1)"><rect width="20" height="12" x="2" y="6" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" /></g></g><g transform="translate(602 215)"><circle class="sk-node-ring" r="29" /><g class="sk-icon" transform="translate(-12 -12) scale(1)"><path d="M10 18v-7M11.12 2.198a2 2 0 0 1 1.76.006l7.866 3.847c.476.233.31.949-.22.949H3.474c-.53 0-.695-.716-.22-.949zM14 18v-7M18 18v-7M3 22h18M6 18v-7" /></g></g><g transform="translate(492 348)"><circle class="sk-node-ring" r="29" /><g class="sk-icon" transform="translate(-12 -12) scale(1)"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2M3 11h3c.8 0 1.6.3 2.1.9l1.1.9c1.6 1.6 4.1 1.6 5.7 0l1.1-.9c.5-.5 1.3-.9 2.1-.9H21" /></g></g><circle class="sk-hot" r="3"><animateMotion dur="4.8s" begin="0s" repeatCount="indefinite" path="M258 256C352 256 354 82 492 82" /></circle></svg>