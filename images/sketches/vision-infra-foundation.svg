 x="0" y="99">MUDANÇAS</text></g><rect class="sk-row-bg" x="64" y="304" width="632" height="48" rx="8" /><text class="sk-small-label" x="88" y="334">UMA IDENTIDADE · UM CONTEXTO · UMA GOVERNANÇA</text></svg>