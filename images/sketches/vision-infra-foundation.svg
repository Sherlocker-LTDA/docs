<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">Infraestrutura para a esteira inteira</title><desc id="description">Motor, OC e Mapa, Motor de Borderô e Monitoramento acompanham o mesmo ciclo antes, durante e depois da entrada.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:16/9;background:transparent;overflow:hidden}
  .sk-grid{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.07}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:rgba(240,161,33,.018);stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:rgba(240,161,33,.018);stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><style>.vision-editorial .sk-label{font-size:22px}.vision-editorial .sk-small-label{font-size:14px;letter-spacing:.08em}.vision-editorial .vision-total{font-size:24px}</style><g class="vision-editorial"><text class="sk-label" x="46" y="48">DO CADASTRO AO MONITORAMENTO</text><text class="sk-small-label" x="46" y="72">UMA ÚNICA JORNADA DE RISCO PARA O FIDC</text><g transform="translate(46 106)"><g class="sk-icon" transform="translate(0 4) scale(1.5)"><path d="M13 5h8M13 12h8M13 19h8m-18-2 2 2 4-4M3 7l2 2 4-4" /></g><text class="sk-label" x="58" y="20">1. ANTES DE ENTRAR</text><text class="sk-small-label" x="58" y="44">O MOTOR VALIDA O CADASTRO COM AS REGRAS DO FIDC.</text></g><g transform="translate(46 172)"><g class="sk-icon" transform="translate(0 4) scale(1.5)"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0zM15 5.764v15M9 3.236v15" /></g><text class="sk-label" x="58" y="20">2. QUANDO HÁ DÚVIDA</text><text class="sk-small-label" x="58" y="44">OC E MAPA APROFUNDAM A ANÁLISE INTERNA.</text></g><g transform="translate(46 238)"><g class="sk-icon" transform="translate(0 4) scale(1.5)"><rect width="20" height="12" x="2" y="6" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" /></g><text class="sk-label" x="58" y="20">3. A CADA OPERAÇÃO</text><text class="sk-small-label" x="58" y="44">O BORDERÔ VERIFICA CEDENTE, SACADOS E TÍTULOS.</text></g><g transform="translate(46 304)"><g class="sk-icon" transform="translate(0 4) scale(1.5)"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5" /></g><text class="sk-label" x="58" y="20">4. DEPOIS DA ENTRADA</text><text class="sk-small-label" x="58" y="44">O MONITORAMENTO SINALIZA O QUE MUDOU.</text></g><text class="sk-label vision-total" x="46" y="398">UMA ESTEIRA · UMA BASE · MENOS APLICATIVOS</text></g></svg>