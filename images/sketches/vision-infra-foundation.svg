<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title description"><title id="title">Infraestrutura para a esteira inteira</title><desc id="description">Motor, Mapa Investigativo, Motor de Borderô e Monitoramento acompanham o mesmo ciclo antes, durante e depois da entrada.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:2/1;background:transparent;overflow:hidden}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-arrow{fill:none;stroke:#f0a121;stroke-width:1.15;stroke-opacity:.7;marker-end:url(#sk-arrow);vector-effect:non-scaling-stroke}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:rgba(240,161,33,.018);stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .sk-section-label{fill:#f0a121;fill-opacity:.76;font:600 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.04em}
  .sk-node-label{fill:#f0a121;fill-opacity:.74;font:500 11px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.04em}
  .sk-flow-label{fill:#f0a121;fill-opacity:.9;font:500 17px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.01em}
  .sk-flow-caption{fill:#f0a121;fill-opacity:.62;font:500 13px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.07em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:rgba(240,161,33,.018);stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
svg{aspect-ratio:760/300}</style><g transform="translate(-15.2 -25) scale(1.04 1)"><style>.vision-journey text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.vision-journey .journey-heading{font-size:17px;font-weight:600;letter-spacing:.04em}.vision-journey .journey-title{font-size:18px;font-weight:600;letter-spacing:.04em;text-anchor:middle}.vision-journey .journey-product{font-size:13px;font-weight:400;letter-spacing:0;text-anchor:middle}</style><g class="vision-journey"><text class="sk-label journey-heading" x="46" y="62">UMA ESTEIRA CONTÍNUA</text><path class="sk-hair" d="M46 86H714" /><path class="sk-arrow" d="M126 172H248" /><path class="sk-arrow" d="M316 172H438" /><path class="sk-arrow" d="M506 172H628" /><g transform="translate(92 172)"><g class="sk-icon" transform="translate(-20 -62) scale(1.6666666666666667)"><path d="M13 5h8M13 12h8M13 19h8m-18-2 2 2 4-4M3 7l2 2 4-4" /></g><circle class="sk-hot" cx="0" cy="0" r="4" /><text class="sk-label journey-title" x="0" y="54">CADASTRO</text><text class="sk-small-label journey-product" x="0" y="82">Motor</text></g><g transform="translate(282 172)"><g class="sk-icon" transform="translate(-20 -62) scale(1.6666666666666667)"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0zM15 5.764v15M9 3.236v15" /></g><circle class="sk-hot" cx="0" cy="0" r="4" /><text class="sk-label journey-title" x="0" y="54">ANÁLISE</text><text class="sk-small-label journey-product" x="0" y="82">OC + Mapa</text></g><g transform="translate(472 172)"><g class="sk-icon" transform="translate(-20 -62) scale(1.6666666666666667)"><rect width="20" height="12" x="2" y="6" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" /></g><circle class="sk-hot" cx="0" cy="0" r="4" /><text class="sk-label journey-title" x="0" y="54">OPERAÇÃO</text><text class="sk-small-label journey-product" x="0" y="82">Borderô</text></g><g transform="translate(662 172)"><g class="sk-icon" transform="translate(-20 -62) scale(1.6666666666666667)"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5" /></g><circle class="sk-hot" cx="0" cy="0" r="4" /><text class="sk-label journey-title" x="0" y="54">ALERTA</text><text class="sk-small-label journey-product" x="0" y="82">Monitoramento</text></g><circle class="sk-hot" r="3"><animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M126 172H628" /></circle></g></g></svg>