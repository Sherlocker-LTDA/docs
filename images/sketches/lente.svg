<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title description"><title id="title">Lente</title><desc id="description">Uma imagem pode originar uma estimativa de localização ou uma comparação facial.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#060605;overflow:hidden}
  .sk-grid{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.07}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:#080806;stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:#080806;stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs>
    <pattern id="lens-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" class="sk-grid" /></pattern>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><rect width="760" height="430" fill="url(#lens-grid)" /><g transform="translate(50 93)"><rect class="sk-plane" x="0" y="0" width="218" height="244" rx="8" /><g class="sk-icon" transform="translate(64 46) scale(3.75)"><rect width="18" height="18" x="3" y="3" rx="2" /><circle cx="9" cy="9" r="2" /><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></g><path class="sk-line" d="M20 198h178" /></g><path class="sk-flow" d="M268 215h76M344 215C394 215 390 112 438 112M344 215C394 215 390 318 438 318" /><circle class="sk-hot" r="3"><animateMotion dur="4.8s" begin="0s" repeatCount="indefinite" path="M268 215h76" /></circle><g transform="translate(438 48)"><rect class="sk-plane" x="0" y="0" width="264" height="132" rx="12" /><g class="sk-icon" transform="translate(24 36) scale(2.5)"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0zM15 5.764v15M9 3.236v15" /></g><g class="sk-icon" transform="translate(136 35) scale(2.4166666666666665)"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0" /><circle cx="12" cy="10" r="3" /></g><circle class="sk-hot" cx="165" cy="66" r="4" /></g><g transform="translate(438 250)"><rect class="sk-plane" x="0" y="0" width="264" height="132" rx="12" /><g class="sk-icon" transform="translate(26 35) scale(2.5833333333333335)"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01" /></g><circle class="sk-node-ring" cx="158" cy="66" r="30" /><g class="sk-icon" transform="translate(144 48) scale(1.1666666666666667)"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></g><g class="sk-icon" transform="translate(210 50) scale(1.3333333333333333)"><path d="M21.801 10A10 10 0 1 1 17 3.335" /><path d="m9 11 3 3L22 4" /></g></g></svg>