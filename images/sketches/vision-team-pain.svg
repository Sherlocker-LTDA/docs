h d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8" /></g><text class="sk-label" x="566" y="205">PDF FINAL</text><path class="sk-line" d="M548 232h134M548 252h112M548 272h124" /><text class="sk-small-label" x="46" y="374">A INVESTIGAÇÃO TERMINA. A CONSOLIDAÇÃO MANUAL CONTINUA.</text></svg>