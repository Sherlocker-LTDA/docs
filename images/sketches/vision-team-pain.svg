<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="title description"><title id="title">Tempo perdido nos intervalos</title><desc id="description">Um analista atravessa vários softwares e gasta tempo abrindo sistemas, consolidando dados e escrevendo o relatório antes da entrega.</desc><style>
  :host{display:block;color:#f0a121}
  svg{display:block;width:100%;height:auto;aspect-ratio:2/1;background:transparent;overflow:hidden}
  .sk-line,.sk-icon,.sk-flow,.sk-hair,.sk-ghost{fill:none;stroke:#f0a121;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .sk-line,.sk-icon{stroke-width:1.55}
  .sk-hair{stroke-width:.85;stroke-opacity:.3}
  .sk-ghost{stroke-width:1;stroke-opacity:.28;stroke-dasharray:5 7}
  .sk-flow{stroke-width:1.1;stroke-opacity:.42;stroke-dasharray:7 8;animation:flow 2.2s linear infinite}
  .sk-arrow{fill:none;stroke:#f0a121;stroke-width:1.15;stroke-opacity:.7;marker-end:url(#sk-arrow);vector-effect:non-scaling-stroke}
  .sk-plane,.sk-row-bg,.sk-icon-box{fill:rgba(240,161,33,.024);stroke:#f0a121;stroke-width:1.15;stroke-opacity:.68;vector-effect:non-scaling-stroke}
  .sk-row-bg{fill:rgba(240,161,33,.018);stroke-opacity:.24}
  .sk-icon-box{stroke-opacity:.34}
  .sk-hot{fill:#f0a121;filter:url(#soft-glow)}
  .sk-label{fill:#f0a121;font:500 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.08em}
  .sk-small-label{fill:#f0a121;fill-opacity:.58;font:500 10px 'DM Mono',ui-monospace,monospace;letter-spacing:.13em}
  .sk-section-label{fill:#f0a121;fill-opacity:.76;font:600 16px 'DM Mono',ui-monospace,monospace;letter-spacing:.04em}
  .sk-node-label{fill:#f0a121;fill-opacity:.74;font:500 11px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.04em}
  .sk-flow-label{fill:#f0a121;fill-opacity:.9;font:500 17px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.01em}
  .sk-flow-caption{fill:#f0a121;fill-opacity:.62;font:500 13px 'DM Mono',ui-monospace,monospace;text-anchor:middle;letter-spacing:.07em}
  .is-muted{opacity:.45}
  .sk-corner{fill:none;stroke:#f0a121;stroke-width:1;stroke-opacity:.35}
  .sk-node-ring,.sk-timeline-dot{fill:rgba(240,161,33,.018);stroke:#f0a121;stroke-width:1.4;vector-effect:non-scaling-stroke}
  .sk-timeline-dot{fill:#f0a121;stroke-width:0;filter:url(#soft-glow)}
  @keyframes flow{to{stroke-dashoffset:-30}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><g transform="translate(-15.2 -25) scale(1.04 1)"><style>.vision-editorial .sk-label{font-size:22px}.vision-editorial .sk-small-label{font-size:14px;letter-spacing:.08em}.vision-editorial .vision-total{font-size:24px}</style><g class="vision-editorial"><text class="sk-label" x="46" y="48">ONDE O TEMPO DO ANALISTA SE PERDE</text><text class="sk-small-label" x="46" y="72">CENÁRIO ILUSTRATIVO · TEMPO DE TOQUE</text><g class="sk-icon" transform="translate(48 96) scale(1.5)"><circle cx="12" cy="8" r="5" /><path d="M20 21a8 8 0 0 0-16 0" /></g><text class="sk-small-label" x="100" y="120">ALÉM DE INVESTIGAR, UMA PESSOA PRECISA:</text><g transform="translate(46 154)"><g class="sk-icon" transform="translate(0 2) scale(1.4166666666666667)"><circle cx="12" cy="12" r="10" /><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20" /></g><text class="sk-label" x="54" y="20">40 MIN</text><text class="sk-small-label" x="166" y="13">ABRIR SOFTWARES</text><text class="sk-small-label" x="166" y="36">E TROCAR ACESSOS</text></g><g transform="translate(46 218)"><g class="sk-icon" transform="translate(0 2) scale(1.4166666666666667)"><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5M3 12A9 3 0 0 0 21 12" /></g><text class="sk-label" x="54" y="20">45 MIN</text><text class="sk-small-label" x="166" y="13">COPIAR DADOS</text><text class="sk-small-label" x="166" y="36">E CONSOLIDAR</text></g><g transform="translate(46 282)"><g class="sk-icon" transform="translate(0 2) scale(1.4166666666666667)"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" /><path d="M14 2v5a1 1 0 0 0 1 1h5M10 9H8M16 13H8M16 17H8" /></g><text class="sk-label" x="54" y="20">60 MIN</text><text class="sk-small-label" x="166" y="13">ESCREVER</text><text class="sk-small-label" x="166" y="36">O RELATÓRIO</text></g><text class="sk-label vision-total" x="46" y="370">145 MIN SÓ PARA COSTURAR O PROCESSO</text><text class="sk-small-label" x="46" y="402">+ 90 MIN DE CONSULTAS + 30 MIN DE REVISÃO = 265 MIN DE TOQUE</text></g></g></svg>