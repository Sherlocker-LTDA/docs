  </g><path class="sk-ghost" d="M348 215C270 215 270 86 182 86M348 215C270 215 270 344 182 344M412 215C490 215 490 86 578 86M412 215C490 215 490 344 578 344" /><g class="sk-stage " transform="translate(52 47)"><rect class="sk-plane" x="0" y="0" width="260" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><path d="M16 10h2M16 14h2M6.17 15a3 3 0 0 1 5.66 0" /><circle cx="9" cy="11" r="2" /><rect x="2" y="5" width="20" height="14" rx="2" /></g><path class="sk-line" d="M62 28h178M62 46h152" /></g><g class="sk-stage " transform="translate(52 305)"><rect class="sk-plane" x="0" y="0" width="260" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><path d="M16 2v2M7 22v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2M8 2v2" /><circle cx="12" cy="11" r="3" /><rect x="3" y="4" width="18" height="18" rx="2" /></g><path class="sk-line" d="M62 28h178M62 46h152" /></g><g class="sk-stage " transform="translate(448 47)"><rect class="sk-plane" x="0" y="0" width="260" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2M3 11h3c.8 0 1.6.3 2.1.9l1.1.9c1.6 1.6 4.1 1.6 5.7 0l1.1-.9c.5-.5 1.3-.9 2.1-.9H21" /></g><path class="sk-line" d="M62 28h178M62 46h152" /></g><g class="sk-stage " transform="translate(448 305)"><rect class="sk-plane" x="0" y="0" width="260" height="78" rx="10" /><g class="sk-icon" transform="translate(16 22) scale(1.25)"><path d="m14 13-8.381 8.38a1 1 0 0 1-3.001-3l8.384-8.381" /><path d="m16 16 6-6" /><path d="m21.5 10.5-8-8" /><path d="m8 8 6-6" /><path d="m8.5 7.5 8 8" /></g><path class="sk-line" d="M62 28h178M62 46h152" /></g><circle class="sk-hot" r="3"><animateMotion dur="4.8s" begin="0s" repeatCount="indefinite" path="M412 215C490 215 490 86 578 86" /></circle></svg>